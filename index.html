<style>
body{margin:0}
/* Layout: one diagram on an aged sheet, ink lines, three colours for three lineages. */
:root {
  --desk: #b9aa88;
  --paper: #eadcbd;
  --ink: #2a2017;
  --quiet: #66543f;
  --edge: #8a7556;
  --blue: #1f4e79;
  --blue-tint: rgba(31, 78, 121, .11);
  --red: #8a2b27;

  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;

  color-scheme: light;
}
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--serif);
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 2000px; margin-inline: auto; display: grid; gap: 12px; }
.frame {
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255, 248, 228, .55), rgba(120, 88, 40, .16) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .26  0 0 0 0 .13  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    var(--paper);
  border: 4px double var(--ink);
  outline: 1px solid var(--edge);
  outline-offset: 4px;
  overflow-x: auto;
  padding: 14px 10px;
}
svg { display: block; width: 100%; min-width: 1100px; height: auto; font-family: var(--serif); }
body.full svg { min-width: 1740px; }
svg > text:first-of-type { font-family: var(--display); font-size: 17px; font-weight: 400; letter-spacing: .02em; }
svg rect { stroke-width: 1.7; }
svg path { stroke-width: 1.7; }

svg text { fill: var(--ink); font-size: 12px; }
svg .b { font-weight: 600; }
svg .q { font-size: 11.5px; fill: var(--quiet); }
svg .title { font-family: var(--display); font-size: 19px; letter-spacing: .02em; }
svg .ct { font-size: 13px; font-weight: 600; }
svg .ct.blue { fill: var(--blue); } svg .ct.red { fill: var(--red); } svg .ct.gold { fill: var(--gold); }
svg .y38 { fill: var(--gold); font-size: 13px; }
svg rect.blue { stroke: var(--blue); fill: var(--blue-tint); }
svg rect.red { stroke: var(--red); fill: var(--red-tint); }
svg rect.gold { stroke: var(--gold); fill: var(--gold-tint); }
svg rect.acc { stroke: var(--gold); fill: rgba(196, 140, 36, .34); stroke-width: 2.4; }
svg rect.wrap { fill: none; stroke-dasharray: 5 4; }
svg rect.wrap.blue { fill: rgba(31, 78, 121, .05); } svg rect.wrap.red { fill: rgba(138, 43, 39, .05); } svg rect.wrap.gold { fill: rgba(196, 140, 36, .08); }
svg path { fill: none; }
svg path.blue { stroke: var(--blue); } svg path.red { stroke: var(--red); } svg path.gold { stroke: var(--gold); stroke-width: 2.6; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.bar h1 { margin: 0; font: 400 20px/1.2 var(--display); letter-spacing: .02em; color: var(--ink); }
.ctl { display: flex; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--paper); }
.seg button { font: 600 13px var(--serif); padding: 6px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; }
.sources { margin: 0; font-size: 13px; line-height: 1.5; color: #2a2017; text-wrap: balance; }
